name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # What a pull request touches, so that a change to the web UI alone
  # skips the Rust jobs and a Rust change skips the UI's. Pushes to main
  # run everything. The jobs are skipped with `if:` rather than path
  # filters on the workflow, so that a required check that does not apply
  # reports as skipped, which counts as passing, instead of never
  # reporting at all.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      ui: ${{ steps.diff.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$files"
          # Everything but the UI's own files is the Rust side's: a path
          # nobody listed runs the Rust jobs rather than none.
          rust=false ui=false
          if grep -qv '^ui/' <<<"$files"; then rust=true; fi
          if grep -qE '^(ui/|docs/api/openapi\.json$|\.github/workflows/ci\.yml$)' <<<"$files"; then ui=true; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

  rust:
    name: fmt, clippy, test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install test tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables restic
          # Ruleset tests load nft in unprivileged user+net namespaces,
          # which Ubuntu's AppArmor policy blocks by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rn nft list ruleset
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: VM test helpers
        run: tests/vm/vpn-check-test.sh
      - name: Release tag checks
        run: tests/ci/release-tags.sh
      - name: Homebrew formula
        run: tests/ci/homebrew-formula.sh

  macos-cli:
    # The CLI is released for macOS too (image.yml, cli-macos): it must
    # build there, and its own tests pass. Its end-to-end tests run
    # sparewalld, which is Linux only.
    name: macOS CLI
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add x86_64-apple-darwin
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy -p sparewall --bins --locked -- -D warnings
      - run: cargo test -p sparewall --bins --locked
      - run: cargo check -p sparewall --locked --target x86_64-apple-darwin
      - name: Node-only commands say so
        run: |
          set +e
          out=$(cargo run -q -p sparewall --locked -- restore --file /dev/null 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" = 2 ] && grep -q 'runs on a Sparewall node' <<<"$out"

  deny:
    name: licenses and advisories
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Prebuilt release binary rather than the Docker-based action, which
      # trips Docker Hub's anonymous pull rate limit.
      - name: Install cargo-deny
        env:
          VERSION: 0.20.2
          SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          f=cargo-deny-$VERSION-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO https://github.com/EmbarkStudios/cargo-deny/releases/download/$VERSION/$f
          echo "$SHA256  $f" | sha256sum -c -
          tar -xzf $f --strip-components=1 -C ~/.cargo/bin cargo-deny-$VERSION-x86_64-unknown-linux-musl/cargo-deny
      - run: cargo deny --locked check licenses advisories bans sources

  sandbox:
    name: sandbox exposure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tests/ci/sandbox-exposure.sh

  acme:
    name: ACME against Pebble
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends podman bind9-dnsutils
      - run: tests/acme/run.sh

  signing:
    name: image signing path
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends podman skopeo jq
      - run: tests/ci/signing.sh

  ui:
    name: web UI
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The image builds the UI with Fedora's Node.js, 22.
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --ignore-scripts
      - name: API types match docs/api/openapi.json
        run: npm run api:check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Licenses of the shipped packages
        run: npm run licenses
      - name: Advisories for the shipped packages
        run: npm audit --omit=dev
