name: Image

# Build the bootc image, boot it in a VM, and (on main and tags) publish it
# to ghcr.io/sparewall/sparewall:testing, signed, with an SBOM attached
# (design: "Build, sign, publish").

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "image/**"
      - "image/providers/**"
      - "crates/**"
      - "Cargo.*"
      - "docs/api/openapi.json"
      - "tests/vm/**"
      - ".github/workflows/image.yml"
      - ".github/check-tag.sh"
      - ".github/version.sh"
      - ".github/upgrade-from.sh"
      - ".github/homebrew-formula.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/sparewall/sparewall
  LOCAL: localhost/sparewall:ci

jobs:
  providers:
    name: provider images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      kea: ${{ steps.refs.outputs.kea }}
      unbound: ${{ steps.refs.outputs.unbound }}
      lego: ${{ steps.refs.outputs.lego }}
      matrix: ${{ steps.suites.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for .github/version.sh

      # Before anything is built or pushed from a tag: the tag is this
      # commit, on main, and a release tag is signed by whoever pushed it
      # (who has push access, or could not have), with a key on their
      # GitHub account (docs/releasing.md). github.actor stays the pusher
      # when someone else re-runs the workflow.
      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_SIGNERS: ${{ github.actor }}
        run: .github/check-tag.sh "$GITHUB_REF_NAME"

      # The VM suites. Upgrades from published releases (#166), one pair
      # suite for each release .github/upgrade-from.sh names and a
      # single-node one from the newest: on a tag (the release waits for
      # them), on main, in a manual run, and in a pull request that
      # changes them (or the version they are picked by).
      - name: Suites
        id: suites
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          suites='[{"suite": "main", "name": "build, boot, publish"},
            {"suite": "faults", "name": "pair faults"},
            {"suite": "installer", "name": "offline install"}]'
          run=true
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
            grep -qxE 'tests/vm/upgrade-test\.sh|\.github/upgrade-from\.sh|\.github/version\.sh|\.github/workflows/image\.yml' <<<"$files" \
              || run=false
          fi
          if [ "$run" = true ]; then
            v=$(.github/version.sh)
            from=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
              --limit 100 --json tagName --jq '.[].tagName' | .github/upgrade-from.sh "$v")
            newest=${from%%$'\n'*}
            for f in $from; do
              suites=$(jq -c --arg f "$f" '. + [{suite: "upgrade-\($f)-pair", name: "upgrade from \($f), pair", upgrade: "pair", from: $f}]' <<<"$suites")
            done
            [ -z "$newest" ] || suites=$(jq -c --arg f "$newest" \
              '. + [{suite: "upgrade-\($f)-single", name: "upgrade from \($f), single node", upgrade: "single", from: $f}]' <<<"$suites")
            echo "upgrades from: ${from//$'\n'/, } (to $v)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "matrix=$(jq -c '{include: .}' <<<"$suites")" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'

      - name: Build, and on main push and sign
        id: refs
        env:
          PUSH: ${{ github.event_name != 'pull_request' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ "$PUSH" = true ]; then
            echo "$TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
            echo "$TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi
          for p in kea unbound lego; do
            repo=ghcr.io/sparewall/$p
            podman build --label org.opencontainers.image.revision=${{ github.sha }} \
              -t "$repo:ci" "image/providers/$p"
            podman run --rm --entrypoint true "$repo:ci"
            echo "base: $(podman image inspect quay.io/fedora/fedora-minimal:45 --format '{{.Digest}}') fedora-minimal:45" >> "$GITHUB_STEP_SUMMARY"
            # Bound images are pinned by an immutable per-commit tag:
            # bootc cannot copy a digest-referenced image between storages.
            short=$(git rev-parse --short=12 HEAD)
            ref="$repo:sha-$short"
            if [ "$PUSH" = true ]; then
              podman push --digestfile "$p.digest" "$repo:ci" "docker://$ref"
              podman push "$repo:ci" "docker://$repo:testing"
              .github/sign-image.sh "$repo@$(cat "$p.digest")"
            else
              # Pull requests boot with the provider images they build,
              # handed to the VM jobs as an artifact (nothing is pushed).
              mkdir -p providers
              podman tag "$repo:ci" "$ref"
              podman save --format oci-archive -o "providers/$p.tar" "$ref"
            fi
            echo "$p=$ref" >> "$GITHUB_OUTPUT"
            echo "$p: $ref" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: provider-images
          path: providers/
          retention-days: 1

  image:
    # One pair of VMs per job (design: "On GitHub Actions"). The main
    # suite publishes; the fault suite runs alongside it.
    name: ${{ matrix.name }}
    needs: providers
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.providers.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for .github/version.sh

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils jq podman busybox bind9-dnsutils iputils-ping wireguard-tools iptables socat dosfstools mtools xorriso dnsmasq-base fdisk swtpm ovmf sshpass
          sudo chmod 666 /dev/kvm
          sudo podman --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'pull_request'
        with:
          name: provider-images
          path: providers

      - name: Load the provider images
        if: github.event_name == 'pull_request'
        run: for f in providers/*.tar; do sudo podman load -q -i "$f"; done

      - name: Build
        run: |
          sudo podman build \
            --file image/Containerfile \
            --build-arg KEA_IMAGE=${{ needs.providers.outputs.kea }} \
            --build-arg UNBOUND_IMAGE=${{ needs.providers.outputs.unbound }} \
            --build-arg LEGO_IMAGE=${{ needs.providers.outputs.lego }} \
            --build-arg SPAREWALL_VERSION="$(.github/version.sh)" \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --tag "$LOCAL" .
          sudo podman image inspect "$LOCAL" --format '{{.Size}}' | numfmt --to=iec
          echo "version: $(sudo podman run --rm --entrypoint sparewall "$LOCAL" --version)" >> "$GITHUB_STEP_SUMMARY"
          for b in quay.io/fedora/fedora:45 quay.io/fedora/fedora-bootc:45; do
            echo "base: $(sudo podman image inspect "$b" --format '{{.Digest}}') $b" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Boot test
        if: matrix.suite == 'main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # bootc pulls the bound provider images at install time.
          echo "$TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          tests/vm/boot-test.sh "$LOCAL" "$RUNNER_TEMP/vm"

      - name: Pair test
        if: matrix.suite == 'main'
        env:
          IMAGE: ${{ env.LOCAL }}
        run: tests/vm/pair-test.sh "$RUNNER_TEMP/vm"

      - name: Pair faults
        if: matrix.suite == 'faults'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          tests/vm/build-disk.sh "$LOCAL" "$RUNNER_TEMP/vm"
          tests/vm/pair-faults.sh "$RUNNER_TEMP/vm"

      - name: Offline install
        if: matrix.suite == 'installer'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          tests/vm/installer-test.sh "$LOCAL" "$RUNNER_TEMP/vm"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: matrix.upgrade

      - name: Upgrade from ${{ matrix.from }}
        if: matrix.upgrade
        env:
          IMAGE: ${{ env.LOCAL }}
          FROM: ${{ matrix.from }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tests/vm/upgrade-test.sh "${{ matrix.upgrade }}" "$RUNNER_TEMP/vm"

      - name: Collect VM logs
        if: failure()
        run: |
          mkdir -p logs
          sudo cp "$RUNNER_TEMP"/vm/*.serial "$RUNNER_TEMP/vm/serial.log" logs/ 2>/dev/null || true
          sudo chown -R "$(id -u)" logs
          tail -200 logs/serial.log 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: vm-logs-${{ matrix.suite }}
          path: logs/
          if-no-files-found: ignore

      - name: Push to testing
        if: github.event_name != 'pull_request' && matrix.suite == 'main'
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          short=$(git rev-parse --short=12 HEAD)
          sudo podman push --digestfile digest "$LOCAL" "docker://$IMAGE:sha-$short"
          sudo podman push "$LOCAL" "docker://$IMAGE:testing"
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && matrix.suite == 'main'

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: github.event_name != 'pull_request' && matrix.suite == 'main'

      - name: Sign, attach SBOM, verify
        if: github.event_name != 'pull_request' && matrix.suite == 'main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "$TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          ref="$IMAGE@$DIGEST"
          .github/sign-image.sh "$ref"
          sudo podman save --format oci-archive -o image.tar "$LOCAL"
          sudo chown "$(id -u)" image.tar
          syft scan oci-archive:image.tar -o spdx-json=sbom.spdx.json
          # An OS image's SBOM exceeds the transparency log's entry size, so
          # the attestation is signed with the project key but not logged;
          # the image signature itself is.
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY --use-signing-config=false --tlog-upload=false \
            --type spdxjson --predicate sbom.spdx.json "$ref"
          # The legacy signature (sign-image.sh): in its default mode cosign
          # reads only OCI-referrer bundles, takes the SBOM's for a
          # signature, and refuses it for want of a log entry.
          cosign verify --key cosign.pub --new-bundle-format=false "$ref" > /dev/null
          cosign verify-attestation --key cosign.pub --insecure-ignore-tlog=true \
            --type spdxjson "$ref" > /dev/null
          echo "Published and verified $ref" >> "$GITHUB_STEP_SUMMARY"

  cli-macos:
    # The CLI for macOS, Apple silicon and Intel, packaged as the release
    # packages it on every run so a tag finds no surprise; the release job
    # takes the tarballs and SBOMs from a tag's run. Signed ad hoc, not
    # with a Developer ID or notarized: a downloaded tarball carries the
    # quarantine attribute, to remove by hand (getting-started.md).
    name: macOS CLI
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for .github/version.sh

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Build, sign, package
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo install --locked cargo-auditable --version 0.7.6
          v=$(.github/version.sh)
          mkdir assets
          for arch in aarch64 x86_64; do
            t=$arch-apple-darwin
            SPAREWALL_VERSION=$v cargo auditable build --release --locked --target "$t" -p sparewall
            b=target/$t/release/sparewall
            codesign --force --sign - "$b"
            codesign --verify --verbose "$b"
            want=$arch; [ "$arch" = aarch64 ] && want=arm64
            [ "$(lipo -archs "$b")" = "$want" ] || { echo "$b is not $want" >&2; exit 1; }
            d=sparewall-$v-$arch-darwin
            mkdir "$d"
            cp "$b" LICENSE README.md "$d/"
            tar -czf "assets/$d.tar.gz" "$d"
            sbom=assets/sparewall-cli-$v-$arch-darwin.spdx.json
            syft scan "file:$d/sparewall" -q -o spdx-json="$sbom"
            jq -e '[.packages[].name] | index("sparewall-core") and index("serde")' "$sbom" >/dev/null \
              || { echo "the $arch CLI SBOM does not list the binary's crates" >&2; exit 1; }
          done
          # The runner is Apple silicon: the arm64 build runs here.
          [ "$(target/aarch64-apple-darwin/release/sparewall --version)" = "sparewall $v" ] \
            || { echo "the CLI does not report version $v" >&2; exit 1; }
          ls -l assets
          echo "version=$v" >> "$GITHUB_OUTPUT"
        id: build

      - name: Homebrew formula
        # The formula the release workflow pushes to sparewall/homebrew-tap,
        # for these tarballs: it installs from a tap, passes its test, and
        # clears a quarantine attribute.
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_FROM_API: 1
          V: ${{ steps.build.outputs.version }}
        run: |
          (cd assets && shasum -a 256 -- *.tar.gz) > sums
          tap=$(brew --repository)/Library/Taps/sparewall-ci/homebrew-tap
          brew tap-new --no-git sparewall-ci/tap
          .github/homebrew-formula.sh "$V" sums "file://$PWD/assets" > "$tap/Formula/sparewall.rb"
          cat "$tap/Formula/sparewall.rb"
          brew style sparewall-ci/tap/sparewall
          brew install --formula sparewall-ci/tap/sparewall
          brew test sparewall-ci/tap/sparewall
          for s in bash zsh fish; do
            sparewall completion "$s" >/dev/null
          done
          test -e "$(brew --prefix)/share/zsh/site-functions/_sparewall"
          # Quarantined as a download would be (Homebrew installs it
          # read-only), then the post-install steps clear it, leaving the mode.
          bin=$(brew --prefix sparewall)/bin/sparewall
          mode=$(stat -f %Lp "$bin")
          chmod u+w "$bin"
          xattr -w com.apple.quarantine '0081;00000000;Safari;' "$bin"
          chmod "$mode" "$bin"
          brew postinstall sparewall-ci/tap/sparewall
          ! xattr -p com.apple.quarantine "$bin" 2>/dev/null \
            || { echo "postinstall left the quarantine attribute" >&2; exit 1; }
          [ "$(stat -f %Lp "$bin")" = "$mode" ] \
            || { echo "postinstall changed the mode from $mode" >&2; exit 1; }
          "$bin" --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: cli-macos
          path: assets/
          retention-days: 1

  cli-linux-arm64:
    # The CLI for arm64 Linux workstations, a static musl binary like the
    # x86_64 one (which the release job builds), built and run natively on
    # an arm64 runner. Only the CLI: arm64 nodes are #1.
    name: Linux arm64 CLI
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for .github/version.sh

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Build and package
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install
          rustup target add aarch64-unknown-linux-musl
          cargo install --locked cargo-auditable --version 0.7.6
          v=$(.github/version.sh)
          t=aarch64-unknown-linux-musl
          SPAREWALL_VERSION=$v cargo auditable build --release --locked --target "$t" -p sparewall
          b=target/$t/release/sparewall
          file "$b" | grep -q 'ARM aarch64.*statically linked' \
            || { file "$b"; echo "$b is not a static arm64 binary" >&2; exit 1; }
          [ "$("$b" --version)" = "sparewall $v" ] \
            || { echo "the CLI does not report version $v" >&2; exit 1; }
          mkdir assets
          d=sparewall-$v-aarch64-linux
          mkdir "$d"
          cp "$b" LICENSE README.md "$d/"
          tar -czf "assets/$d.tar.gz" "$d"
          sbom=assets/sparewall-cli-$v-aarch64-linux.spdx.json
          syft scan "file:$d/sparewall" -q -o spdx-json="$sbom"
          jq -e '[.packages[].name] | index("sparewall-core") and index("serde")' "$sbom" >/dev/null \
            || { echo "the arm64 CLI SBOM does not list the binary's crates" >&2; exit 1; }
          ls -l assets

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: cli-linux-arm64
          path: assets/
          retention-days: 1

  release:
    # A v* tag that passed the VM suites: installer and disk images, the
    # CLI, checksums and SBOMs, in a draft GitHub release. Publishing the
    # draft promotes the image (release.yml).
    name: release assets
    needs: [image, cli-macos, cli-linux-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils jq podman zstd xorriso

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: The tested image
        id: image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          ref="$IMAGE:sha-$(git rev-parse --short=12 HEAD)"
          cosign verify --key cosign.pub --new-bundle-format=false "$ref" > /dev/null
          sudo podman pull "$ref"
          [ "$(sudo podman run --rm --entrypoint sparewall "$ref" --version)" = "sparewall ${GITHUB_REF_NAME#v}" ] \
            || { echo "$ref does not report version ${GITHUB_REF_NAME#v}" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$(sudo podman image inspect "$ref" --format '{{.Digest}}')" >> "$GITHUB_OUTPUT"

      - name: Installer and disk images
        run: image/installers.sh "${{ steps.image.outputs.ref }}" "${GITHUB_REF_NAME#v}" assets

      - name: CLI
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
          # cargo-auditable embeds the binary's dependency list, from which
          # syft makes the CLI's SBOM: what is linked, not the workspace.
          cargo install --locked cargo-auditable --version 0.7.6
          v=${GITHUB_REF_NAME#v}
          SPAREWALL_VERSION=$v cargo auditable build --release --locked --target x86_64-unknown-linux-musl -p sparewall
          [ "$(target/x86_64-unknown-linux-musl/release/sparewall --version)" = "sparewall $v" ] \
            || { echo "the CLI does not report version $v" >&2; exit 1; }
          d=sparewall-$v-x86_64-linux
          mkdir "$d"
          cp target/x86_64-unknown-linux-musl/release/sparewall LICENSE README.md "$d/"
          tar -czf "assets/$d.tar.gz" "$d"
          sbom=assets/sparewall-cli-$v.spdx.json
          syft scan "file:$d/sparewall" -q -o spdx-json="$sbom"
          jq -e '[.packages[].name] | index("sparewall-core") and index("serde")' "$sbom" >/dev/null \
            || { echo "the CLI SBOM does not list the binary's crates" >&2; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-macos
          path: assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-linux-arm64
          path: assets

      - name: Image SBOM
        run: |
          sudo podman save --format oci-archive -o image.tar "${{ steps.image.outputs.ref }}"
          sudo chown "$(id -u)" image.tar
          syft scan oci-archive:image.tar -q -o spdx-json="assets/sparewall-image-${GITHUB_REF_NAME#v}.spdx.json"
          rm image.tar

      - name: Checksums, signed
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cd assets
          sha256sum -- * > SHA256SUMS
          # And each split file whole, for whoever joins its pieces.
          for p in *.part00; do
            [ -e "$p" ] || continue
            f=${p%.part00}
            echo "$(cat -- "$f".part[0-9][0-9] | sha256sum | cut -d' ' -f1)  $f" >> SHA256SUMS
          done
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
            --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --key ../cosign.pub --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.image.outputs.ref }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          v=${GITHUB_REF_NAME#v}
          docs="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs"
          prerelease=()
          case $v in *-*) prerelease=(--prerelease) ;; esac
          if [ ${#prerelease[@]} = 0 ]; then
            channel="Nodes on the \`stable\` channel are offered it once it is published."
          else
            channel="A prerelease: nodes on the \`stable\` channel are not offered it."
          fi
          # For readers of the release: what changed (GitHub's list of the
          # pull requests since the last release), how to get it, and how
          # to verify the downloads. What publishing does is for the
          # maintainer, in the run summary.
          changes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" -q .body)
          cat > notes.md <<NOTES
          $changes

          ## Installing and upgrading

          The image is \`$IMAGE:$v\` (\`$DIGEST\`). $channel
          Upgrade a node or a pair with \`sparewall upgrade\` ([operations]($docs/operations.md#upgrades)).

          For a new install ([getting started]($docs/getting-started.md)):

          - \`sparewall-$v-x86_64.iso\` installs unattended to the first fixed
            disk of the machine it boots, **only if that disk is blank**; it
            stops at a disk with anything on it.
          - \`sparewall-$v-x86_64.raw.zst\` is a disk image to write to a disk,
            and \`.qcow2\` the same for virtual machines.
          - \`sparewall-$v-x86_64-linux.tar.gz\` is the \`sparewall\` CLI, to
            manage nodes over SSH from a workstation; \`-aarch64-linux\` is
            the same for arm64 Linux, and \`-aarch64-darwin\` and
            \`-x86_64-darwin\` for a Mac (Apple silicon, Intel).
            Homebrew installs it on either: \`brew install sparewall/tap/sparewall\`.

          Files named \`.partNN\` are pieces of one file (GitHub limits a file to
          2 GiB): \`cat\` them together, in order.

          ## Verifying the downloads

          \`SHA256SUMS\` is signed with the project key (\`cosign.pub\` in the
          repository) and lists every file, including each split file joined:

          \`\`\`shell
          cosign verify-blob --key cosign.pub --bundle SHA256SUMS.sigstore.json SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          \`\`\`

          The macOS CLI is signed ad hoc, not notarized: after unpacking a
          downloaded tarball, clear its quarantine attribute with
          \`xattr -d com.apple.quarantine sparewall\` (Homebrew does this itself).

          The SPDX SBOMs list what is in the image and in each CLI build.
          NOTES
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag "${prerelease[@]}" \
            --title "Sparewall $v" --notes-file notes.md assets/*
          {
            echo "Drafted the release. Publishing it tags \`$REF\` (\`$DIGEST\`) as \`$IMAGE:$v\`"
            [ ${#prerelease[@]} != 0 ] || echo "and promotes it to \`stable\`"
            echo "(release.yml). Edit the notes on the draft first if they need it."
          } >> "$GITHUB_STEP_SUMMARY"
