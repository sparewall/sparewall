name: Image

# Build the bootc image, boot it in a VM, and (on main and tags) publish it
# to ghcr.io/sparewall/sparewall:testing, signed, with an SBOM attached
# (design: "Build, sign, publish").

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "image/**"
      - "image/providers/**"
      - "crates/**"
      - "Cargo.*"
      - "tests/vm/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/sparewall/sparewall
  LOCAL: localhost/sparewall:ci

jobs:
  providers:
    name: provider images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      kea: ${{ steps.refs.outputs.kea }}
      unbound: ${{ steps.refs.outputs.unbound }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'

      - name: Build, and on main push and sign
        id: refs
        env:
          PUSH: ${{ github.event_name != 'pull_request' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ "$PUSH" = true ]; then
            echo "$TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
            echo "$TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi
          for p in kea unbound; do
            repo=ghcr.io/sparewall/$p
            podman build --label org.opencontainers.image.revision=${{ github.sha }} \
              -t "$repo:ci" "image/providers/$p"
            podman run --rm "$repo:ci" true
            if [ "$PUSH" = true ]; then
              podman push --digestfile "$p.digest" "$repo:ci" "docker://$repo:testing"
              ref="$repo@$(cat "$p.digest")"
              cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$ref"
            else
              # Pull requests boot with the published provider images.
              ref="$repo@$(skopeo inspect --format '{{.Digest}}' "docker://$repo:testing" 2>/dev/null)" \
                || ref="$repo:testing"
            fi
            echo "$p=$ref" >> "$GITHUB_OUTPUT"
            echo "$p: $ref" >> "$GITHUB_STEP_SUMMARY"
          done

  image:
    name: build, boot, publish
    needs: providers
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils jq podman
          sudo chmod 666 /dev/kvm
          sudo podman --version

      - name: Build
        run: |
          sudo podman build \
            --file image/Containerfile \
            --build-arg KEA_IMAGE=${{ needs.providers.outputs.kea }} \
            --build-arg UNBOUND_IMAGE=${{ needs.providers.outputs.unbound }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --tag "$LOCAL" .
          sudo podman image inspect "$LOCAL" --format '{{.Size}}' | numfmt --to=iec

      - name: Boot test
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # bootc pulls the bound provider images at install time.
          echo "$TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          tests/vm/boot-test.sh "$LOCAL" "$RUNNER_TEMP/vm"

      - name: Collect VM logs
        if: failure()
        run: |
          mkdir -p logs
          cp "$RUNNER_TEMP/vm/serial.log" logs/ 2>/dev/null || true
          tail -200 logs/serial.log 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: vm-logs
          path: logs/
          if-no-files-found: ignore

      - name: Push to testing
        if: github.event_name != 'pull_request'
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          short=$(git rev-parse --short=12 HEAD)
          sudo podman push --digestfile digest "$LOCAL" "docker://$IMAGE:sha-$short"
          sudo podman push "$LOCAL" "docker://$IMAGE:testing"
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: github.event_name != 'pull_request'

      - name: Sign, attach SBOM, verify
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "$TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          ref="$IMAGE@$DIGEST"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$ref"
          sudo podman save --format oci-archive -o image.tar "$LOCAL"
          sudo chown "$(id -u)" image.tar
          syft scan oci-archive:image.tar -o spdx-json=sbom.spdx.json
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY \
            --type spdxjson --predicate sbom.spdx.json "$ref"
          cosign verify --key cosign.pub "$ref" > /dev/null
          cosign verify-attestation --key cosign.pub --type spdxjson "$ref" > /dev/null
          echo "Published and verified $ref" >> "$GITHUB_STEP_SUMMARY"
