name: Rebuild

# Whether the newest release should be rebuilt on fresh Fedora base images
# (#187), and if so, image.yml on its tag with `rebuild`: the same source,
# every suite, then the release's tag and stable move to the rebuild. A
# code change is a patch release, never a rebuild.
#
# Rebuild for any security advisory pending in the stable image, and at
# least every 30 days. Scheduled runs act only while the repository
# variable REBUILDS is "on". The release tag's signature is checked as
# for a release, against the keys of the repository's maintainers, since
# the bot that dispatches it signs nothing: here, with this branch's
# check-tag.sh, and again by image.yml as it was at the tag.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even with no advisory pending and a recent build.
        type: boolean
        default: false
      dry_run:
        description: Decide and report only.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rebuild
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sparewall/sparewall
  MAX_AGE_DAYS: 30

jobs:
  decide:
    name: decide
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # dispatch image.yml
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release tags

      - name: Decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          ENABLED: ${{ vars.REBUILDS }}
          FORCE: ${{ inputs.force || false }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          say() { echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          if [ "$EVENT" = schedule ] && [ "$ENABLED" != on ]; then
            say "Scheduled rebuilds are off: set the repository variable REBUILDS to \`on\`."
            exit 0
          fi
          tag=$(gh release view --json tagName --jq .tagName)
          release=${tag#v}
          # The rebuild runs image.yml as it was at the tag.
          if ! git show "$tag:.github/workflows/image.yml" | grep -q '^      rebuild:$'; then
            say "$tag predates rebuilds (its image.yml takes no \`rebuild\`): release a new version instead."
            exit 0
          fi
          # Before #226, a rebuild's tag check read a list of signers from
          # a repository variable, which is gone: the roles are the list.
          if git show "$tag:.github/check-tag.sh" | grep -q RELEASE_SIGNERS; then
            say "$tag's own tag check predates checking the repository's roles (#226): release a new version instead."
            exit 0
          fi
          labels=$(skopeo inspect --no-tags "docker://$IMAGE:stable" | jq .Labels)
          current=$(jq -r '."org.sparewall.version" // ""' <<<"$labels")
          if [ "${current%%+*}" != "$release" ]; then
            say "stable is \`$current\`, not $release (or a rebuild of it): nothing to rebuild."
            exit 0
          fi
          n=1
          [[ $current != *+r* ]] || n=$((${current##*+r} + 1))
          created=$(jq -r '."org.opencontainers.image.created" // ""' <<<"$labels")
          age=$(( ($(date +%s) - $(date -d "${created:-1970-01-01}" +%s)) / 86400 ))
          # What the stable image would install now that it has not.
          sudo podman pull -q "$IMAGE:stable" >/dev/null
          advisories=$(sudo podman run --rm --entrypoint dnf "$IMAGE:stable" \
            -q advisory list --security --json 2>/dev/null | jq -r '[.[].name] | unique | join(", ")')
          say "stable: \`$current\`, built $created ($age days ago)"
          say "security advisories pending: ${advisories:-none}"
          why=
          if [ "$FORCE" = true ]; then why="asked for"
          elif [ -n "$advisories" ]; then why="security advisories"
          elif [ "$age" -ge "$MAX_AGE_DAYS" ]; then why="$age days since the last build"
          fi
          if [ -z "$why" ]; then
            say "No rebuild: no advisory pending, and built within $MAX_AGE_DAYS days."
            exit 0
          fi
          say "Rebuild $tag as $release+r$n: $why."
          # Who may release is whoever has the role now (docs/releasing.md),
          # so check the tag with this branch's checker, whatever the
          # tag's own copy says.
          if ! GITHUB_SHA=$(git rev-parse "$tag^{commit}") .github/check-tag.sh "$tag"; then
            echo "::error::$tag is not signed by one of the repository's maintainers"
            exit 1
          fi
          if [ "$DRY_RUN" = true ]; then
            say "(a dry run: nothing dispatched)"
            exit 0
          fi
          gh workflow run image.yml --ref "$tag" -f rebuild="$n" -f advisories="$advisories"
          say "Dispatched image.yml on $tag with rebuild=$n."
