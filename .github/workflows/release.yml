name: Release

# Publishing a release (drafted by image.yml's release job for a v* tag)
# tags the tested image with its version and, unless it is a prerelease,
# promotes it to the stable channel (design: "Channels").

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sparewall/sparewall

jobs:
  promote:
    name: promote the image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Tag and promote
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
          echo "$TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          src="$IMAGE:sha-$(git rev-parse --short=12 HEAD)"
          cosign verify --key cosign.pub --new-bundle-format=false "$src" > /dev/null
          # The same manifest under new tags: its signature and SBOM,
          # attached by digest, carry over.
          tags=("${TAG#v}")
          [ "$PRERELEASE" = true ] || tags+=(stable)
          for t in "${tags[@]}"; do
            skopeo copy --all --preserve-digests "docker://$src" "docker://$IMAGE:$t"
            cosign verify --key cosign.pub --new-bundle-format=false "$IMAGE:$t" > /dev/null
            .github/check-sigpolicy.sh "$IMAGE:$t"
            echo "$src is now $IMAGE:$t" >> "$GITHUB_STEP_SUMMARY"
          done

  homebrew:
    # The tap's formula follows each release, so `brew upgrade` does too.
    # Pushed with HOMEBREW_TAP_TOKEN, a fine-grained token that may write
    # sparewall/homebrew-tap's contents and nothing else.
    name: Homebrew tap
    needs: promote
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Update the formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set: sparewall/homebrew-tap was not updated"
            exit 0
          fi
          v=${TAG#v}
          gh release download "$TAG" -p SHA256SUMS -p SHA256SUMS.sigstore.json
          cosign verify-blob --key cosign.pub --bundle SHA256SUMS.sigstore.json SHA256SUMS
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/sparewall/homebrew-tap" tap
          f=tap/Formula/sparewall.rb
          # A release of an older line (a backport) leaves the tap alone.
          if [ -f "$f" ]; then
            cur=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$f")
            if [ "$(printf '%s\n%s\n' "$cur" "$v" | sort -V | tail -1)" != "$v" ]; then
              echo "The tap has $cur, newer than $v: left alone" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          mkdir -p tap/Formula
          .github/homebrew-formula.sh "$v" SHA256SUMS > "$f"
          cd tap
          git add Formula/sparewall.rb
          if git diff --cached --quiet; then
            echo "The tap already has $v" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "sparewall $v"
          git push -q origin HEAD:main
          echo "sparewall/homebrew-tap now installs $v" >> "$GITHUB_STEP_SUMMARY"
