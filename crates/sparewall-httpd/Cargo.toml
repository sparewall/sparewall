[package]
name = "sparewall-httpd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sparewall-api = { version = "0.1.0", path = "../sparewall-api" }
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "time", "signal", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zlink = { version = "0.7.1", default-features = false, features = ["tokio", "proxy", "tracing"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "time", "io-util"] }
