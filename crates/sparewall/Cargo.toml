[package]
name = "sparewall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sparewall-api = { version = "0.1.0", path = "../sparewall-api" }
sparewall-config = { version = "0.1.0", path = "../sparewall-config" }
sparewall-core = { version = "0.1.0", path = "../sparewall-core" }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "io-util", "io-std", "process", "time"] }
zlink = { version = "0.7.1", default-features = false, features = ["tokio", "proxy", "tracing"] }

[lints]
workspace = true
