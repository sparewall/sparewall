[package]
name = "sparewalld"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1"] }
jiff = "0.2.38"
listenfd = "1.0.2"
rcgen = "0.14.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sparewall-api = { version = "0.1.0", path = "../sparewall-api" }
sparewall-config = { version = "0.1.0", path = "../sparewall-config" }
sparewall-core = { version = "0.1.0", path = "../sparewall-core" }
sparewall-render = { version = "0.1.0", path = "../sparewall-render" }
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "time", "signal", "sync", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zlink = { version = "0.7.1", default-features = false, features = ["tokio", "service", "proxy", "tracing"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
