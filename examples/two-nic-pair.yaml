# An HA pair of two-NIC mini PCs behind plain switches, with no VLANs: the
# WAN on one port of each node; on the other, one segment that is the LAN,
# management and the sync network at once (#177). Replication, DHCP HA and
# configuration pushes travel inside the WireGuard sync tunnel, which drops
# anything not from the peer's key.
schema: 1
cluster:
  nodes: [fw1, fw2]
  sync_network: lan
  vrrp:
    priority: { fw1: 110, fw2: 100 }
management:
  network: lan
  sources: [192.168.1.10]
ports:
  fw1:
    wan0: { nic: "52:54:00:aa:00:01" }
    lan0: { nic: "52:54:00:aa:00:02" }
  fw2:
    wan0: { nic: "52:54:00:bb:00:01" }
    lan0: { nic: "52:54:00:bb:00:02" }
networks:
  wan:
    port: wan0
    role: wan
    addresses: { fw1: 203.0.113.2/29, fw2: 203.0.113.3/29 }
    vip: 203.0.113.1/29
    vrid: 10
    gateway: 203.0.113.6
  lan:
    port: lan0
    role: management
    addresses: { fw1: 192.168.1.2/24, fw2: 192.168.1.3/24 }
    vip: 192.168.1.1/24
    vrid: 20
zones:
  wan: { networks: [wan] }
  lan: { networks: [lan] }
policy:
  lan->wan: { action: accept, nat: { snat: 203.0.113.1 } }
  lan->self:
    action: drop
    rules:
      ping: { order: 100, proto: icmp, icmp_type: [echo-request], action: accept }
      dns: { order: 200, proto: udp, dport: 53, action: accept }
  wan->self: { action: drop }
dhcp:
  lan:
    pool: 192.168.1.100-192.168.1.199
    reservations:
      admin: { mac: "52:54:00:12:34:10", address: 192.168.1.10, hostname: admin }
dns:
  enabled: true
  domain: home.arpa
