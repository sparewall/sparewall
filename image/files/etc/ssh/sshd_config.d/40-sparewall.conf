# Keys only, no root login over SSH (design: "Management-plane isolation").
# The admin account's keys come from the node identity; sparewalld writes
# them to ~admin/.ssh/authorized_keys, where SELinux lets sshd read them.
PermitRootLogin no
# management.ssh.password: sparewalld renders PasswordAuthentication here,
# ahead of the default below (sshd keeps the first value it reads).
Include /run/sparewall/ssh/*.conf
PasswordAuthentication no
KbdInteractiveAuthentication no
