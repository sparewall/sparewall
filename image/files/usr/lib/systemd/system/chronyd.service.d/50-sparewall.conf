# chrony reads the configuration sparewalld renders (design: "Time").
[Unit]
After=sparewall-early.service

[Service]
ExecStart=
ExecStart=/usr/sbin/chronyd -n -f /run/chrony/sparewall.conf $OPTIONS
Type=simple
# Tighter than Fedora's unit (#360). It turns NoNewPrivileges off again,
# and allows netlink and /var/spool, only for mailonchange's sendmail,
# which the rendered configuration never uses. The SELinux module allows
# the transition into chronyd_t under NoNewPrivileges.
NoNewPrivileges=yes
RestrictAddressFamilies=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
ReadWritePaths=
ReadWritePaths=/run /var/lib/chrony -/var/log
# chronyd starts as root, binds its sockets and writes its pid file in
# /run/chrony (the chrony user's, so root needs DAC_OVERRIDE there), then
# keeps only SYS_TIME and NET_BIND_SERVICE as the chrony user.
# systemd-tmpfiles makes its directories, owned by chrony, so it chowns
# nothing.
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_SYS_TIME CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_DAC_OVERRIDE
# chronyd's own seccomp filter (-F 2, from /etc/sysconfig/chronyd) stays
# on. This is systemd's: an allow list in place of Fedora's deny list,
# which it resets first (a later line would only shorten a deny list).
SystemCallFilter=
SystemCallFilter=@system-service @clock
SystemCallErrorNumber=EPERM
RestrictRealtime=yes
UMask=0027
