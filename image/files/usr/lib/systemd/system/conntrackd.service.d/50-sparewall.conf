# conntrackd reads the configuration sparewalld renders; sparewalld starts
# it only once a pair's sync tunnel is configured.
[Unit]
After=sparewalld.service
ConditionPathExists=/run/sparewall/conntrackd/conntrackd.conf

[Service]
# It binds the sync tunnel address, which appears once the tunnel is up.
Restart=on-failure
RestartSec=5s
ExecStart=
ExecStart=/usr/sbin/conntrackd -C /run/sparewall/conntrackd/conntrackd.conf
