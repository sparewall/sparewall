# keepalived reads the configuration sparewalld renders; sparewalld starts
# it only on a node in a pair.
[Unit]
After=sparewalld.service
ConditionPathExists=/run/sparewall/keepalived/keepalived.conf

[Service]
ExecStart=
ExecStart=/usr/sbin/keepalived --dont-fork --log-console --use-file=/run/sparewall/keepalived/keepalived.conf
Type=simple
