# Host metrics for the coordinator's /metrics, which carries them to the
# management network under its own access rules: listen on localhost only.
[Service]
ExecStart=
ExecStart=/usr/bin/node_exporter --web.listen-address=127.0.0.1:9100 \
    --web.disable-exporter-metrics --collector.systemd \
    --collector.netdev.device-exclude=^(lo|veth.*)$
