# The QEMU guest agent, for a node that is a VM: the hypervisor can freeze
# the filesystems for a consistent snapshot, read the node's addresses and
# ask it to shut down. The unit starts only when the hypervisor gives the
# VM the agent's channel; on hardware it never does.
#
# Only what that needs, and what is read-only: no guest-exec, no file
# access, no SSH keys or passwords, no suspend. An allow list, so an RPC a
# later qemu-ga adds stays off; $QEMU_GA_ARGS from /etc/sysconfig/qemu-ga
# is not passed on, so it cannot widen it either.
[Service]
ExecStart=
ExecStart=/usr/bin/qemu-ga --method=virtio-serial \
    --path=/dev/virtio-ports/org.qemu.guest_agent.0 \
    -F${FSFREEZE_HOOK_PATHNAME} \
    --allow-rpcs=guest-sync-delimited,guest-sync,guest-ping,guest-info,guest-get-time,guest-set-time,guest-shutdown,guest-fsfreeze-status,guest-fsfreeze-freeze,guest-fsfreeze-freeze-list,guest-fsfreeze-thaw,guest-fstrim,guest-network-get-interfaces,guest-network-get-route,guest-get-vcpus,guest-get-disks,guest-get-fsinfo,guest-get-host-name,guest-get-users,guest-get-timezone,guest-get-osinfo,guest-get-diskstats,guest-get-cpustats,guest-get-load,guest-get-memory-blocks,guest-get-memory-block-info
