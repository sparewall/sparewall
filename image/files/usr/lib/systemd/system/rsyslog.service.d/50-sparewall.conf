# Forwarding to a syslog collector is configured by the document
# (logging.remote.provider: syslog); otherwise rsyslog does not run. It
# only forwards: nothing reads /etc/rsyslog.conf or writes /var/log.
[Unit]
ConditionPathExists=/run/sparewall/logging/rsyslog.conf

[Service]
EnvironmentFile=
ExecStart=
ExecStart=/usr/sbin/rsyslogd -n -f /run/sparewall/logging/rsyslog.conf
