d /var/home/admin 0700 admin admin -
d /var/home/admin/.ssh 0700 admin admin -
d /var/lib/sparewall 0711 root root -
d /var/lib/sparewall/keys 0700 root root -
d /run/systemd/network 0755 root root -
d /etc/sparewall 0755 root root -
# The host resolves through systemd-resolved; it never serves the LAN.
L+ /etc/resolv.conf - - - - ../run/systemd/resolve/stub-resolv.conf
# Log forwarding settings rendered by sparewalld.
d /run/systemd/journal-upload.conf.d 0755 root root -
L /run/systemd/journal-upload.conf.d/50-sparewall.conf - - - - /run/sparewall/logging/journal-upload.conf
# Runtime directories of confined daemons, where their configs go.
d /run/chrony 0750 chrony chrony -
d /run/keepalived 0755 root root -
