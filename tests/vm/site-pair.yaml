# Two-node test (tests/vm/pair-test.sh). Management on QEMU user networking
# (one per VM), a shared VLAN trunk (users on VLAN 20, servers on 30), and
# a dedicated sync port carrying VLAN 4000.
# The sync keys are filled in by the test from each node's status.
schema: 1
cluster:
  nodes: [fw1, fw2]
  sync_network: sync
  sync_keys:
    fw1: "@FW1_KEY@"
    fw2: "@FW2_KEY@"
  vrrp:
    priority: { fw1: 150, fw2: 100 }
management: { network: mgmt }
ports:
  fw1:
    uplink: { nic: "52:54:00:12:34:56" }
    trunk: { nic: "52:54:00:12:34:57" }
    syncp: { nic: "52:54:00:12:34:58" }
  fw2:
    uplink: { nic: "52:54:00:12:35:56" }
    trunk: { nic: "52:54:00:12:35:57" }
    syncp: { nic: "52:54:00:12:35:58" }
networks:
  mgmt: { port: uplink, role: management, dhcp_client: true }
  wan:
    port: trunk
    vlan: 10
    role: wan
    addresses: { fw1: 203.0.113.2/24, fw2: 203.0.113.3/24 }
    vip: 203.0.113.1/24
    vrid: 10
  users:
    port: trunk
    vlan: 20
    addresses: { fw1: 192.0.2.2/24, fw2: 192.0.2.3/24 }
    vip: 192.0.2.1/24
    vrid: 20
  servers:
    port: trunk
    vlan: 30
    addresses: { fw1: 198.51.100.2/24, fw2: 198.51.100.3/24 }
    vip: 198.51.100.1/24
    vrid: 30
  sync:
    port: syncp
    vlan: 4000
    role: sync
    addresses: { fw1: 10.255.0.1/30, fw2: 10.255.0.2/30 }
zones:
  mgmt: { networks: [mgmt] }
  users: { networks: [users] }
  servers: { networks: [servers] }
  wan: { networks: [wan] }
  vpn: {}
policy:
  mgmt->self: { action: drop }
  users->servers:
    action: drop
    rules:
      echo: { order: 100, proto: tcp, dport: [7000], action: accept }
  servers->self: { action: drop }
  users->self:
    action: drop
    rules:
      ping: { order: 100, proto: icmp, icmp_type: [echo-request], action: accept }
  vpn->servers: { action: accept }
dhcp:
  users: { pool: 192.0.2.100-192.0.2.199 }
# Remote access on the WAN gateway address (tests/vm/vpn.sh). The client
# keys are filled in by the test.
vpn:
  ra:
    listen_port: 51820
    # vpnb connects on 53, as from a network that blocks other UDP (#50).
    extra_ports: [53]
    endpoint: 203.0.113.1
    addresses: [10.99.0.1/24]
    zone: vpn
    peers:
      vpna: { public_key: "@VPNA@", addresses: [10.99.0.10/32], preshared_key: "secret:psk-vpna" }
      vpnb: { public_key: "@VPNB@", addresses: [10.99.0.11/32] }
      vpnc: { public_key: "@VPNC@", addresses: [10.99.0.12/32] }
      natc: { public_key: "@NATC@", addresses: [10.99.0.13/32] }
      natk: { public_key: "@NATK@", addresses: [10.99.0.14/32] }
